databaseChangeLog:
  - changeSet:
      id: 001-create-credentials-table
      author: auth-service
      changes:
        - createTable:
            tableName: credentials
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_credentials
              - column:
                  name: login
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: password_hash
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addUniqueConstraint:
            tableName: credentials
            columnNames: login
            constraintName: uq_credentials_login

        - addUniqueConstraint:
            tableName: credentials
            columnNames: user_id
            constraintName: uq_credentials_user_id

        - sql:
            sql: ALTER TABLE credentials ADD CONSTRAINT chk_credentials_role CHECK (role IN ('ADMIN', 'USER'))
